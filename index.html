<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>채부심 부동산 마불 2026</title><style>*{box-sizing:border-box}body{margin:0;background:#101c25;color:#f5f3eb;font-family:system-ui,sans-serif}header{padding:18px 4%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #40505b}header b{color:#e5c483;letter-spacing:.1em}small{color:#bbc5cd}.wrap{max-width:1200px;margin:auto;padding:20px}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));aspect-ratio:1.25;gap:5px;background:#40505b;padding:6px;border-radius:12px}.tile{padding:8px;border-radius:5px;color:#15252d;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:clamp(11px,1.7vw,24px);font-weight:800}.tile small{font-size:clamp(8px,1vw,14px);color:#334750;font-weight:500}.center{grid-area:2/2/6/6;background:#142a36;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:6px;padding:12px}h1{font-size:clamp(24px,5vw,70px);margin:8px 0;line-height:1.05;color:#f5d497}h2{font-size:22px} .decks{display:flex;gap:12px;margin-top:20px}.deck{padding:16px 18px;border-radius:8px;font-weight:bold;color:#162935}.policy{background:#abc9e4}.variable{background:#e6c58b}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#203541;border:1px solid #425965;padding:18px;border-radius:10px}.card h3{margin:0 0 10px;color:#f5d497}.card p{line-height:1.6;margin:0;color:#e0e6e8}footer{padding:24px 0;color:#aebdc5;font-size:13px}@media(max-width:600px){.wrap{padding:8px}.board{aspect-ratio:1;gap:3px;padding:3px}.tile{padding:2px}.decks{gap:4px;margin-top:8px}.deck{font-size:11px;padding:8px}.cards{grid-template-columns:1fr}header{font-size:12px}}@media print{body{background:white;color:black}.wrap{max-width:none}.board,.card,header{-webkit-print-color-adjust:exact;print-color-adjust:exact}.card{break-inside:avoid}}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 15px;font-weight:800;background:#f5d497;color:#142a36;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid white;outline-offset:3px}.controls{display:flex;gap:8px;justify-content:center}.minor{background:transparent;color:#bdc9d2;font-size:12px;padding:5px;margin-top:4px}.tile{position:relative;transition:box-shadow .2s}.tile.active{box-shadow:inset 0 0 0 4px #fff, inset 0 0 0 7px #18374b}.tile.active:after{content:'●';color:#18374b;background:white;border:2px solid #18374b;border-radius:50%;width:20px;height:20px;line-height:16px;font-size:13px;position:absolute;right:4px;bottom:4px}.tile.visited:before{content:'✓';position:absolute;top:3px;left:5px;font-size:12px;color:#2d6540}#dice{font-size:44px;line-height:1.1;margin:3px}#status{font-weight:700;font-size:clamp(12px,2vw,21px);margin-top:8px}#progress{font-size:12px;color:#bbc5cd;margin-top:8px}.decks{margin-top:8px}dialog{border:1px solid #8195a3;border-radius:18px;background:#203541;color:#fff;width:min(85vw,600px);padding:30px;box-shadow:0 20px 80px #0008}dialog::backdrop{background:#08131dcc}dialog h2{font-size:32px;color:#f5d497;margin:12px 0}dialog p{font-size:20px;line-height:1.6}#popHint{font-size:14px;color:#bdc9d2}#kind{font-weight:800;letter-spacing:.1em;color:#abc9e4}@media(max-width:600px){#dice{font-size:26px}.controls button,.deck{font-size:10px;padding:6px}#progress,.minor{font-size:9px}#status{font-size:11px}.center h1{font-size:24px}.center>small{font-size:9px}.center{padding:4px}}@media(min-width:601px){.board{max-height:82vh;max-width:1100px;margin:auto}.center h1{font-size:clamp(28px,4vw,55px)}} </style></head><body><header><b>채부심 · 2026 YEAR END</b><small>촬영용 1인 플레이</small></header><main class="wrap"><div class="board" id="board"><div class="center"><small>한 바퀴로 끝내는 대한민국 부동산</small><h1>부동산 마불<br>2026</h1><small>지역 × 정책 × 변수</small><div id="status" aria-live="polite">출발 · 주사위를 굴려주세요</div><div id="dice">⚀</div><div class="controls"><button id="roll">주사위 굴리기</button><button id="next">한 칸 이동</button></div><div class="decks"><button class="deck policy" id="drawP">정책 카드 뽑기</button><button class="deck variable" id="drawV">변수 카드 뽑기</button></div><div id="progress"></div><button id="reset" class="minor">처음부터</button></div></div><h2>정책 카드</h2><div class="cards" id="policy"></div><h2>변수 카드</h2><div class="cards" id="variable"></div><footer>기획 시안 · 카드의 상황은 가상 사례입니다. 실제 정책의 시행 여부, 적용 요건 및 시장 수치는 촬영일 기준 원자료 검증 후 확정합니다. 승패 없는 촬영 진행용 게임.</footer><dialog id="popup"><div id="kind"></div><h2 id="popTitle"></h2><p id="popBody"></p><p id="popHint"></p><button id="closePop">확인 · 해설 계속</button></dialog></main><script>const tiles=[['출발','2026 결산','#b7cfbb'],['강남','고가주택','#e9b7ac'],['서초','재건축','#e9b7ac'],['송파','대단지','#e9b7ac'],['용산','입지·개발','#b9d0e4'],['정책 카드','제도','#abc9e4'],['성동','수요 이동','#b9d0e4'],['마포','한강벨트','#b9d0e4'],['노원','구매력','#b9d0e4'],['과천','서울 대체','#c2d6b7'],['변수 카드','시장','#e6c58b'],['분당','정비사업','#c2d6b7'],['광명','공급','#c2d6b7'],['동탄','교통·입주','#c2d6b7'],['인천','수급','#c2d6b7'],['정책 카드','제도','#abc9e4'],['부산','지역 격차','#d9c7ae'],['대구','미분양','#d9c7ae'],['대전','수요·공급','#d9c7ae'],['세종','정책 변수','#d9c7ae']];const coords=[[1,1],[1,2],[1,3],[1,4],[1,5],[1,6],[2,6],[3,6],[4,6],[5,6],[6,6],[6,5],[6,4],[6,3],[6,2],[6,1],[5,1],[4,1],[3,1],[2,1]];tiles.forEach((t,i)=>{let e=document.createElement('div');e.className='tile';e.style.background=t[2];e.style.gridArea=coords[i].join('/');e.innerHTML=t[0]+'<small>'+t[1]+'</small>';board.append(e)});const policies=[['주택담보대출','현금 4억 원, 연봉 8천만 원인 무주택자가 10억 원 주택을 살 수 있을까?'],['토지거래허가','세입자가 거주 중인 주택을 매입하려면 무엇을 확인해야 할까?'],['다주택자 규제','기존 주택을 보유한 채 추가 매입하거나 대출을 연장할 수 있을까?'],['부동산 세제','주택을 추가 취득하거나 처분할 때 세금은 어떻게 달라질까?'],['임대차 제도','계약 만기를 앞둔 세입자와 임대인에게 어떤 선택지가 있을까?'],['주택공급 대책','신규 공급 발표를 보고 기존 주택 매입을 미룰 것인가?'],['재건축 제도','정비사업 대상 주택을 살 때 확인할 규정은?'],['실수요자 지원','신혼부부와 생애최초 구매자가 이용할 수 있는 제도는?']];const variables=[['금리','대출금리가 1%p 상승하면 월 상환 부담은?'],['환율','환율 변동이 건설 원가와 금융 여건에 미치는 영향은?'],['주식시장','같은 자기자본으로 주택과 금융자산에 투자한다면?'],['공사비','추가분담금이 증가하면 재건축 사업성은?'],['교통','교통망 개통 기대와 실제 개통 효과는 어떻게 구분할까?'],['입주물량','대규모 입주를 앞둔 지역의 전세·매매 수급은?'],['인구','인구 감소와 가구 변화가 주택 수요에 미치는 영향은?'],['구매력','소득이 줄거나 주거비가 늘면 매수 여력은?']];for(const [id,data] of [['policy',policies],['variable',variables]]){data.forEach(([title,body],i)=>{const el=document.createElement('article');el.className='card';el.innerHTML='<h3>'+String(i+1).padStart(2,'0')+' · '+title+'</h3><p>'+body+'</p>';document.getElementById(id).append(el)})}
const $=id=>document.getElementById(id), cells=[...document.querySelectorAll('.tile')];let pos=0,finished=false,busy=false,visited=new Set([0]),usedP=[],usedV=[];const prompts={강남:'고가주택 거래와 구매력은 어떻게 달라졌나?',서초:'재건축 기대와 사업비는 시장에 어떻게 작용했나?',송파:'대단지 거래와 입주 여건은?',용산:'개발 기대와 입지 가치는?',성동:'수요 이동과 거래가격의 변화는?',마포:'한강벨트 시장의 특징은?',노원:'중저가 주택과 실수요자의 구매력은?',과천:'서울 대체 수요와 공급은?',분당:'노후계획도시 정비사업의 변수는?',광명:'공급과 입주가 시장에 미치는 영향은?',동탄:'교통망과 입주물량의 영향은?',인천:'지역별 매매·전세 수급은?',부산:'지역 내 시장 격차는?',대구:'미분양과 공급 여건은?',대전:'수요와 공급의 균형은?',세종:'정책 및 공급 기대가 시장에 미치는 영향은?'};
function render(){cells.forEach((c,i)=>{c.classList.toggle('active',i===pos);c.classList.toggle('visited',visited.has(i))});$('status').textContent=finished?'완주! 2027년 시장 전망':tiles[pos][0]+' · '+tiles[pos][1];$('progress').textContent=finished?'한 바퀴 완료':`진행 ${pos} / ${tiles.length}칸`; $('roll').disabled=busy||finished;$('next').disabled=busy||finished;$('drawP').disabled=busy||usedP.length===policies.length;$('drawV').disabled=busy||usedV.length===variables.length;}
function show(kind,title,body,hint){$('kind').textContent=kind;$('popTitle').textContent=title;$('popBody').textContent=body;$('popHint').textContent=hint;$('popup').showModal()}
function draw(type){const data=type==='policy'?policies:variables,used=type==='policy'?usedP:usedV;const left=data.map((_,i)=>i).filter(i=>!used.includes(i));if(!left.length){show('카드','모든 카드 공개 완료','처음부터 시작하면 다시 뽑을 수 있습니다.','');return}const i=left[Math.floor(Math.random()*left.length)];used.push(i);render();show(type==='policy'?'정책 카드 · POLICY':'변수 카드 · VARIABLE',data[i][0],data[i][1],'현재 지역: '+tiles[pos][0]+' | 가상 사례 · 실제 수치 및 정책은 촬영 전 검증')}
function arrive(){if(finished){show('FINISH','2026년 결산 완료','2027년 부동산 시장에서 가장 주목해야 할 정책과 변수는 무엇일까요?','올해의 핵심 키워드 3가지로 마무리');return}const name=tiles[pos][0];if(name==='정책 카드')draw('policy');else if(name==='변수 카드')draw('variable');else show('지역 결산',name,prompts[name]||'올해의 시장 특징은 무엇인가요?','촬영용 질문 · 지역별 실거래가와 거래량은 검증 자료로 해설')}
async function move(n){if(busy||finished)return;busy=true;render();for(let i=0;i<n;i++){await new Promise(r=>setTimeout(r,180));if(pos===tiles.length-1){pos=0;finished=true;render();break}pos++;visited.add(pos);render()}busy=false;render();arrive()}
$('roll').onclick=()=>{const n=1+Math.floor(Math.random()*6);$('dice').textContent=String.fromCodePoint(0x2680+n-1);move(n)};$('next').onclick=()=>{$('dice').textContent='⚀';move(1)};$('drawP').onclick=()=>draw('policy');$('drawV').onclick=()=>draw('variable');$('closePop').onclick=()=>$('popup').close();$('reset').onclick=()=>{if(busy)return;if(!confirm('진행 상황과 사용한 카드를 초기화할까요?'))return;pos=0;finished=false;visited=new Set([0]);usedP=[];usedV=[];$('dice').textContent='⚀';render()};render();
</script></body></html>
