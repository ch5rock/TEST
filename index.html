<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>채부심 부동산 마불 2026</title><style>*{box-sizing:border-box}body{margin:0;background:#101c25;color:#f5f3eb;font-family:system-ui,sans-serif}header{padding:18px 4%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #40505b}header b{color:#e5c483;letter-spacing:.1em}small{color:#bbc5cd}.wrap{max-width:1200px;margin:auto;padding:20px}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));aspect-ratio:1.25;gap:5px;background:#40505b;padding:6px;border-radius:12px}.tile{padding:8px;border-radius:5px;color:#15252d;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:clamp(11px,1.7vw,24px);font-weight:800}.tile small{font-size:clamp(8px,1vw,14px);color:#334750;font-weight:500}.center{grid-area:2/2/6/6;background:#142a36;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:6px;padding:12px}h1{font-size:clamp(24px,5vw,70px);margin:8px 0;line-height:1.05;color:#f5d497}h2{font-size:22px} .decks{display:flex;gap:12px;margin-top:20px}.deck{padding:16px 18px;border-radius:8px;font-weight:bold;color:#162935}.policy{background:#abc9e4}.variable{background:#e6c58b}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#203541;border:1px solid #425965;padding:18px;border-radius:10px}.card h3{margin:0 0 10px;color:#f5d497}.card p{line-height:1.6;margin:0;color:#e0e6e8}footer{padding:24px 0;color:#aebdc5;font-size:13px}@media(max-width:600px){.wrap{padding:8px}.board{aspect-ratio:1;gap:3px;padding:3px}.tile{padding:2px}.decks{gap:4px;margin-top:8px}.deck{font-size:11px;padding:8px}.cards{grid-template-columns:1fr}header{font-size:12px}}@media print{body{background:white;color:black}.wrap{max-width:none}.board,.card,header{-webkit-print-color-adjust:exact;print-color-adjust:exact}.card{break-inside:avoid}}</style></head><body><header><b>채부심 · 2026 YEAR END</b><small>촬영용 정적 콘셉트 보드</small></header><main class="wrap"><div class="board" id="board"><div class="center"><small>한 바퀴로 끝내는 대한민국 부동산</small><h1>부동산 마불<br>2026</h1><small>지역 × 정책 × 변수</small><div class="decks"><div class="deck policy">정책 카드</div><div class="deck variable">변수 카드</div></div></div></div><h2>정책 카드</h2><div class="cards" id="policy"></div><h2>변수 카드</h2><div class="cards" id="variable"></div><footer>기획 시안 · 카드의 상황은 가상 사례입니다. 실제 정책의 시행 여부, 적용 요건 및 시장 수치는 촬영일 기준 원자료 검증 후 확정합니다. 게임 플레이 기능 없음.</footer></main><script>const tiles=[['출발','2026 결산','#b7cfbb'],['강남','고가주택','#e9b7ac'],['서초','재건축','#e9b7ac'],['송파','대단지','#e9b7ac'],['용산','입지·개발','#b9d0e4'],['정책 카드','제도','#abc9e4'],['성동','수요 이동','#b9d0e4'],['마포','한강벨트','#b9d0e4'],['노원','구매력','#b9d0e4'],['과천','서울 대체','#c2d6b7'],['변수 카드','시장','#e6c58b'],['분당','정비사업','#c2d6b7'],['광명','공급','#c2d6b7'],['동탄','교통·입주','#c2d6b7'],['인천','수급','#c2d6b7'],['정책 카드','제도','#abc9e4'],['부산','지역 격차','#d9c7ae'],['대구','미분양','#d9c7ae'],['대전','수요·공급','#d9c7ae'],['세종','정책 변수','#d9c7ae']];const coords=[[1,1],[1,2],[1,3],[1,4],[1,5],[1,6],[2,6],[3,6],[4,6],[5,6],[6,6],[6,5],[6,4],[6,3],[6,2],[6,1],[5,1],[4,1],[3,1],[2,1]];tiles.forEach((t,i)=>{let e=document.createElement('div');e.className='tile';e.style.background=t[2];e.style.gridArea=coords[i].join('/');e.innerHTML=t[0]+'<small>'+t[1]+'</small>';board.append(e)});const policies=[['주택담보대출','현금 4억 원, 연봉 8천만 원인 무주택자가 10억 원 주택을 살 수 있을까?'],['토지거래허가','세입자가 거주 중인 주택을 매입하려면 무엇을 확인해야 할까?'],['다주택자 규제','기존 주택을 보유한 채 추가 매입하거나 대출을 연장할 수 있을까?'],['부동산 세제','주택을 추가 취득하거나 처분할 때 세금은 어떻게 달라질까?'],['임대차 제도','계약 만기를 앞둔 세입자와 임대인에게 어떤 선택지가 있을까?'],['주택공급 대책','신규 공급 발표를 보고 기존 주택 매입을 미룰 것인가?'],['재건축 제도','정비사업 대상 주택을 살 때 확인할 규정은?'],['실수요자 지원','신혼부부와 생애최초 구매자가 이용할 수 있는 제도는?']];const variables=[['금리','대출금리가 1%p 상승하면 월 상환 부담은?'],['환율','환율 변동이 건설 원가와 금융 여건에 미치는 영향은?'],['주식시장','같은 자기자본으로 주택과 금융자산에 투자한다면?'],['공사비','추가분담금이 증가하면 재건축 사업성은?'],['교통','교통망 개통 기대와 실제 개통 효과는 어떻게 구분할까?'],['입주물량','대규모 입주를 앞둔 지역의 전세·매매 수급은?'],['인구','인구 감소와 가구 변화가 주택 수요에 미치는 영향은?'],['구매력','소득이 줄거나 주거비가 늘면 매수 여력은?']];for(const [id,data] of [['policy',policies],['variable',variables]]){data.forEach(([title,body],i)=>{const el=document.createElement('article');el.className='card';el.innerHTML='<h3>'+String(i+1).padStart(2,'0')+' · '+title+'</h3><p>'+body+'</p>';document.getElementById(id).append(el)})}</script></body></html>
